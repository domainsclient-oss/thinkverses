      - list [ref=e800]:
        - listitem [ref=e801]:
          - heading [level=3] [ref=e802]:
            - button "Digital Twin Technology What is a Digital Twin, and how does Thinkverses use it?" [expanded] [ref=e803]:
              - generic [ref=e804]:
                - generic [ref=e805]: Digital Twin Technology
                - generic [ref=e806]: What is a Digital Twin, and how does Thinkverses use it?
          - region "Digital Twin Technology What is a Digital Twin, and how does Thinkverses use it?" [ref=e811]:
            - paragraph [ref=e813]: A Digital Twin is a virtual replica of a physical asset, process or facility that stays in sync through real-time data. Thinkverses builds AI-powered operational Digital Twins that simulate scenarios and recommend decisions before any physical action is taken.
        - listitem [ref=e814]:
          - heading [level=3] [ref=e815]:
            - button "Digital Twin Technology Which industries can benefit from Digital Twin solutions?" [ref=e816]:
              - generic [ref=e817]:
                - generic [ref=e818]: Digital Twin Technology
                - generic [ref=e819]: Which industries can benefit from Digital Twin solutions?
          - region "Digital Twin Technology Which industries can benefit from Digital Twin solutions?":
            - paragraph [ref=e822]: Any operation with valuable assets and complex processes. We focus on Manufacturing, Oil & Gas, Energy & Utilities, Smart Buildings, Infrastructure and Industrial Operations.
        - listitem [ref=e823]:
          - heading [level=3] [ref=e824]:
            - button "Robotics How do Robotics and Digital Twins work together?" [ref=e825]:
              - generic [ref=e826]:
                - generic [ref=e827]: Robotics
                - generic [ref=e828]: How do Robotics and Digital Twins work together?
          - region "Robotics How do Robotics and Digital Twins work together?":
            - paragraph [ref=e831]: The Digital Twin decides and the robotics act. Decisions are tested in simulation, executed by robotic systems, and the execution data flows back to keep the model accurate.
        - listitem [ref=e832]:
          - heading [level=3] [ref=e833]:
            - button "IoT Integration Can your platform integrate with our existing systems and sensors?" [ref=e834]:
              - generic [ref=e835]:
                - generic [ref=e836]: IoT Integration
                - generic [ref=e837]: Can your platform integrate with our existing systems and sensors?
          - region "IoT Integration Can your platform integrate with our existing systems and sensors?":
            - paragraph [ref=e840]: Yes. We connect IoT devices, industrial sensors, ERP systems, cloud platforms and other operational technology you already run, so there is no need to start from scratch.
        - listitem [ref=e841]:
          - heading [level=3] [ref=e842]:
            - button "AI Capabilities What role does AI play in your solutions?" [ref=e843]:
              - generic [ref=e844]:
                - generic [ref=e845]: AI Capabilities
                - generic [ref=e846]: What role does AI play in your solutions?
          - region "AI Capabilities What role does AI play in your solutions?":
            - paragraph [ref=e849]: Machine learning forecasts asset behaviour and detects anomalies, while Generative AI lets your team ask the twin questions in plain language and get explained recommendations.
        - listitem [ref=e850]:
          - heading [level=3] [ref=e851]:
            - button "Implementation How does an implementation work?" [ref=e852]:
              - generic [ref=e853]:
                - generic [ref=e854]: Implementation
                - generic [ref=e855]: How does an implementation work?
          - region "Implementation How does an implementation work?":
            - paragraph [ref=e858]: "Four stages: operational assessment, Digital Twin or robotics design, build and integration with your data, then deployment and continuous improvement. Engagements can be project-based or multi-year."
        - listitem [ref=e859]:
          - heading [level=3] [ref=e860]:
            - button "Implementation How do you keep our data secure?" [ref=e861]:
              - generic [ref=e862]:
                - generic [ref=e863]: Implementation
                - generic [ref=e864]: How do you keep our data secure?
          - region "Implementation How do you keep our data secure?":
            - paragraph [ref=e867]: Data is encrypted at rest and in transit, access is role-based, and environments are isolated per client in line with industry-standard practice.
        - listitem [ref=e868]:
          - heading [level=3] [ref=e869]:
            - button "Business Benefits How do we know it works?" [ref=e870]:
              - generic [ref=e871]:
                - generic [ref=e872]: Business Benefits
                - generic [ref=e873]: How do we know it works?
          - region "Business Benefits How do we know it works?":
            - paragraph [ref=e876]: "Decisions are tested in simulation first, then validated against real-world outcomes. Success is tracked at three levels: decision accuracy, execution precision and business impact."
        - listitem [ref=e877]:
          - heading [level=3] [ref=e878]:
            - button "Business Benefits What business benefits can we expect?" [ref=e879]:
              - generic [ref=e880]:
                - generic [ref=e881]: Business Benefits
                - generic [ref=e882]: What business benefits can we expect?
          - region "Business Benefits What business benefits can we expect?":
            - paragraph [ref=e885]: Typical goals include predictive maintenance, better asset utilisation, remote monitoring, earlier anomaly detection, lower operating costs and progress on sustainability targets.
